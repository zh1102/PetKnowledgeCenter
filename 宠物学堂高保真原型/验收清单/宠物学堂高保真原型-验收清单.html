":"P0","preconditions":"任一儿童页面","data":"无成人验证","steps":["点击或长按家长入口"],"expected":"出现成人验证说明；敏感操作不得直接开放。"},{"id":"PS-006","module":"拼音","title":"纠错具体且可重试","priority":"P0","preconditions":"打开 P03","data":"第三声上扬不足","steps":["查看纠错提示","点击再听一次","点击重新跟读"],"expected":"指出声调问题，允许重听/重录/家长确认，不只显示红叉。"},{"id":"PS-007","module":"数学","title":"答错后提供分步提示","priority":"P0","preconditions":"打开 P05","data":"8+5 选择 12","steps":["选择错误答案","查看提示"],"expected":"提示如何凑十，不立即只给最终答案，不出现羞辱文案。"},{"id":"PS-008","module":"英语版权","title":"分级跟读不复制第三方内容","priority":"P0","preconditions":"打开 P07","data":"原型示例句","steps":["检查标题和示例内容"],"expected":"明确为自有 A 级示例，没有第三方教材正文、插画或音频。"},{"id":"PS-009","module":"响应式","title":"iPad 横竖屏布局不同","priority":"P0","preconditions":"打开 P01 与 P02","data":"1024×768、768×1024","steps":["对比两页面布局"],"expected":"横屏主从双栏、竖屏加宽单栏；176px 左栏始终可见。"},{"id":"PS-010","module":"响应式","title":"手机固定图标栏可用","priority":"P0","preconditions":"打开 P12/P13","data":"390×844、844×390","steps":["检查 64px 左栏","检查横屏答题双栏"],"expected":"完整文字不挤入侧栏；主要操作可见，无横向溢出。"},{"id":"PS-011","module":"可访问性","title":"非颜色状态提示","priority":"P1","preconditions":"打开 P09/P14","data":"完成、部分、今日、失败","steps":["关闭颜色识别假设检查标记"],"expected":"状态同时使用图标、文字或形状表达。"},{"id":"PS-012","module":"可访问性","title":"热区和字号","priority":"P0","preconditions":"浏览所有核心页面","data":"儿童按钮和正文","steps":["测量主要控件","检查正文与任务标题"],"expected":"点击区至少 44×44pt；正文至少 16px，核心任务至少 18px。"},{"id":"PS-013","module":"内容安全","title":"AI 内容不直达儿童","priority":"P0","preconditions":"阅读 PRD 内容规则","data":"每日换新内容","steps":["核对内容来源与审核状态"],"expected":"只允许已审核、已分级、可追溯内容；AI 仅生成后台草稿。"},{"id":"PS-014","module":"异常状态","title":"状态覆盖完整","priority":"P1","preconditions":"打开 P14","data":"加载、空、离线、失败、完成、下架","steps":["逐项检查动作与文案"],"expected":"每项都有明确原因、下一步和安全回退。"},{"id":"PS-015","module":"长文本","title":"超长孩子名和任务名","priority":"P1","preconditions":"替换为 20 字昵称和 40 字任务名","data":"极端长度文本","steps":["检查各视口"],"expected":"不遮挡按钮、不越界；允许合理换行或省略并提供完整信息入口。"},{"id":"PS-016","module":"减少动态","title":"减少动态效果","priority":"P1","preconditions":"系统开启 prefers-reduced-motion","data":"所有动画页面","steps":["重新打开原型"],"expected":"连续动画停止，操作反馈仍通过文字和静态图可理解。"}]}</script><script>
// 验收结果按“文件路径 + 版本 + 用例编号”保存，避免不同版本相互覆盖。

data.cases.push(

  {id:'PS-018',module:'宠物成长',title:'四阶段只前进不倒退',priority:'P0',preconditions:'打开P17',data:'成长值 0、49、50、199、200、499、500',steps:['逐一设置边界成长值','检查阶段和下一阶段条件','模拟漏打卡或长期未登录'],expected:'阶段按 50/200/500 门槛推进；边界归属正确；遗漏任务不会造成退化、受伤或离开。'},
  {id:'PS-019',module:'幻想伙伴',title:'确定性解锁且无付费抽取',priority:'P0',preconditions:'打开P19',data:'仓鼠30礼包日+语数英各5项；小青龙60礼包日+四类各10项',steps:['检查解锁条件与进度','达标后再次提高后台门槛'],expected:'达标后永久保留领养资格；无星星购买、概率、付费、稀有度和限时倒计时。'},
  {id:'PS-020',module:'宠物装扮',title:'装扮无属性加成',priority:'P0',preconditions:'打开P18',data:'适用与不适用装扮',steps:['预览适用装扮','点击不适用装扮','恢复默认并保存'],expected:'装扮只改变外观；不适用装扮禁用且不扣星；支持预览、取消和恢复默认。'},
  {id:'PS-021',module:'未来伙伴',title:'占位不作虚假承诺',priority:'P1',preconditions:'打开P20',data:'未来伙伴占位',steps:['检查剪影、按钮和说明'],expected:'仅说明更多伙伴正在准备中；不展示具体上线日期、价格、倒计时或预付入口。'},
  {id:'PS-022',module:'动画降级',title:'每阶段具备静态兜底',priority:'P0',preconditions:'开启减少动态效果或模拟动画加载失败',data:'五种宠物四阶段',steps:['进入宠物详情和成长路线','触发动画不可用状态'],expected:'显示与当前物种和阶段一致的静态图；业务按钮仍可使用，成长状态不丢失。'}

// 家庭学习任务验收覆盖分类、难度、隐私与重复奖励四类高风险边界。
data.cases.push(
  {id:'PS-023',module:'家长计划',title:'五项首页学习任务可配置',priority:'P0',preconditions:'完成成人验证并打开P10',data:'阅读打卡、英语打卡、三米打卡、数学天天练、讲数学题',steps:['逐一选择任务','设置频率、时长或题量','保存并启用'],expected:'五项任务均可配置并与孩子首页名称一致；修改只影响未来任务。'},
  {id:'PS-024',module:'内容难度',title:'幼小至小学低年级衔接分档',priority:'P0',preconditions:'打开P10能力档设置',data:'启蒙、幼小衔接、一年级基础、一年级巩固',steps:['依次切换能力档','检查数学与英语内容范围'],expected:'默认幼小衔接；题目符合中国大众5–8岁基础范围，不默认出现超前奥数、复杂语法或长篇英文阅读。'},
  {id:'PS-025',module:'隐私',title:'录音照片默认关闭',priority:'P0',preconditions:'新建英语或讲题任务',data:'未授权证明材料',steps:['检查默认设置','尝试开启录音或照片'],expected:'录音照片默认关闭，视频不作为MVP默认方式；开启前说明用途、保存期限并提供删除入口。'},
  {id:'PS-026',module:'奖励账本',title:'系统练习与家庭打卡不重复结算',priority:'P0',preconditions:'同一数学内容同时被计划引用',data:'数学天天练与自建打卡',steps:['从两个入口提交同一任务','检查星星与进度'],expected:'两入口指向同一任务实例或阻止重复创建；只结算一次星星，历史结果可追溯。'}
);
// 最新闭环用例覆盖首次领养门槛、整日礼包结算、确认等待和多宠独立成长。
data.cases.push(
  {id:'PS-027',module:'首次领养',title:'未领养不能跳过进入今日任务',priority:'P0',preconditions:'孩子首次登录且没有宠物',data:'小猫、小狗、兔子',steps:['尝试直接进入今日任务','选择一只伙伴','确认领养'],expected:'首次必须显示领取伙伴页；只能从猫狗兔选择一只；确认后才进入今日任务，首只免费。'},
  {id:'PS-028',module:'今日奖励',title:'单项只增加进度整日一次结算',priority:'P0',preconditions:'今日有5个必做任务',data:'完成前4项再完成第5项',steps:['逐项检查余额','完成最后一项','领取今日礼包','重复领取'],expected:'前4项只增加进度不发星星；全部满足后礼包解锁；领取一次增加余额，重复操作返回原结果。'},
  {id:'PS-029',module:'家长确认',title:'待确认任务阻止礼包提前领取',priority:'P0',preconditions:'其余必做任务完成且存在1项待确认',data:'家庭学习打卡',steps:['检查礼包状态','家长确认通过','返回孩子端领取'],expected:'确认前礼包不可领取且余额不变；确认通过后礼包解锁；退回时保持未完成并展示温和说明。'},
  {id:'PS-030',module:'多宠领养',title:'后续伙伴独立保存成长',priority:'P0',preconditions:'已领养首只并达到第二只里程碑',data:'第二只常见伙伴',steps:['从宠物中心进入领养新伙伴','确认第二只','切换当前伙伴再切回'],expected:'第二只按明确里程碑领养；两只宠物分别保存阶段、成长值和状态；切换不清空历史。'}
);
// v1.1 数值与跨日规则用例：覆盖固定礼包、投喂上限、阶段边界及晚确认。
data.cases.push(
  {id:'PS-031',module:'今日礼包',title:'每日礼包固定20星且只领取一次',priority:'P0',preconditions:'全部必做任务已确认',data:'同一孩子同一业务日期，两台设备并发领取',steps:['两台设备同时领取','检查余额与奖励账本','重复使用原幂等键'],expected:'最终只增加20星且只有一条daily_package账本；所有重复请求返回相同结算结果。'},
  {id:'PS-032',module:'宠物投喂',title:'投喂5星换5成长且每日最多4次',priority:'P0',preconditions:'余额至少25星且当前宠物可互动',data:'同一家庭日期连续投喂5次',steps:['完成前4次投喂','发起第5次','检查余额、成长值和账本'],expected:'前4次各扣5星并增加5成长；第5次被拒绝且不扣星、不增加成长、不产生半完成记录。'},
  {id:'PS-033',module:'成长阶段',title:'成长值门槛边界正确',priority:'P0',preconditions:'可构造宠物成长值',data:'49→50、199→200、499→500',steps:['分别完成一次成长值增加','中断并重复请求','检查阶段纪念记录'],expected:'只在50、200、500首次跨越时升级；重复请求不重复升级或生成纪念卡。'},
  {id:'PS-034',module:'跨日确认',title:'家长晚确认不丢失原日期礼包',priority:'P0',preconditions:'昨日必做任务仅剩1项待确认',data:'次日家长确认通过',steps:['跨日确认昨日提交','进入昨日记录领取礼包','检查周报归属'],expected:'不自动通过；确认后昨日礼包变为可领取且不失效；奖励和任务统计归属昨日。'},
  {id:'PS-035',module:'当日计划',title:'已生成计划不能通过删任务刷礼包',priority:'P0',preconditions:'当日必做任务未完成',data:'普通编辑、安全下架、家长跳过三种操作',steps:['普通删减当日任务','模拟安全下架','家长填写原因跳过','检查审计和礼包资格'],expected:'普通修改次日生效；安全下架或家长跳过才可取消当日任务并留审计；礼包已领取后不重新结算。'},
  {id:'PS-036',module:'伙伴解锁',title:'基础与幻想伙伴资格永久保留',priority:'P0',preconditions:'分别达到第二只、仓鼠和小青龙里程碑',data:'14/30/60礼包日与分类任务门槛',steps:['达到门槛','写入解锁资格','提高后台配置门槛','重新登录'],expected:'已获得资格仍可领养；领养不扣星；重复任务、驳回任务和练习模式不计入分类里程碑。'},
  {id:'PS-037',module:'讲数学题',title:'两种提交方式均由家长最终确认',priority:'P0',preconditions:'打开P21且家长已启用讲数学题',data:'当面讲、录音讲、系统辅助检查',steps:['选择当面讲并提交','选择录音讲并提交','模拟系统答案检查','家长通过或退回'],expected:'两种方式提交后均进入等待家长确认；系统辅助结果不直接完成任务；家长通过后进度+1，退回后可查看原因并重新讲。'}
  ,{id:'PS-038',module:'阅读打卡',title:'阅读记录可选填且不强制照片',priority:'P0',preconditions:'打开P22且家长已配置阅读目标',data:'计时10分钟、书名40字边界、空选填项',steps:['完成计时','留空书名和页数提交','填写边界长度再次提交','由家长通过或退回'],expected:'不上传照片也能提交；提交进入等待家长确认；家长通过后进度+1，退回显示原因并保留可用草稿。'},
  {id:'PS-039',module:'三米打卡',title:'家长下发内容与双提交方式',priority:'P0',preconditions:'打开P23且家长已配置三米打卡',data:'当面完成、录音完成、材料缺失',steps:['核对任务说明来源','分别选择两种方式提交','关闭录音授权','模拟材料下架'],expected:'页面明确三米为教师任务；两种方式均由家长最终确认；无授权时保留当面完成；材料缺失时禁止提交空任务。'},
  {id:'PS-040',module:'关键弹窗',title:'任务退出、提交与退回可恢复',priority:'P0',preconditions:'打开P24',data:'退出、提交成功、待确认、家长退回、离线失败',steps:['逐一打开弹窗','检查主次操作','模拟重复提交和提交失败','关闭后检查原页面状态'],expected:'弹窗说明后果并提供安全回退；重复提交不重复加进度；失败不伪装成功；关闭弹窗后原页面上下文保留。'},
  {id:'PS-041',module:'关键弹窗',title:'奖励、领养和投喂幂等边界',priority:'P0',preconditions:'打开P24并准备礼包、首宠和星星边界数据',data:'20星礼包、首只免费、投喂5星、余额不足、每日第5次',steps:['领取礼包两次','确认首宠两次','正常投喂','余额不足投喂','发起每日第5次投喂'],expected:'礼包和首宠各只成功一次；正常投喂原子扣5星并加5成长；余额不足或超限不扣星、不加成长。'}
);
function render(){const body=document.querySelector('#cases');body.innerHTML=data.cases.map(c=>`<tr><td><strong>${c.id}</strong><br>${c.title}</td><td>${c.module}<br><strong>${c.priority}</strong></td><td><strong>前置：</strong>${c.preconditions}<br><strong>数据：</strong>${c.data}<ol>${c.steps.map(s=>`<li>${s}</li>`).join('')}</ol></td><td>${c.expected}</td><td><select data-id="${c.id}">${states.map(s=>`<option ${saved[c.id]?.status===s?'selected':''}>${s}</option>`).join('')}</select><textarea data-note="${c.id}" placeholder="实际结果、证据或跳过原因">${saved[c.id]?.note||''}</textarea></td></tr>`).join('');body.querySelectorAll('select,textarea').forEach(el=>el.onchange=save);summary()}
function save(e){const id=e.target.dataset.id||e.target.dataset.note;saved[id]??={status:'待验收',note:''};if(e.target.dataset.id)saved[id].status=e.target.value;else saved[id].note=e.target.value;localStorage.setItem(key,JSON.stringify(saved));summary()}
function summary(){const count=Object.fromEntries(states.map(s=>[s,0]));data.cases.forEach(c=>count[saved[c.id]?.status||'待验收']++);const executed=count['通过']+count['未通过'],den=data.cases.length-count['跳过'],rate=executed?Math.round(count['通过']/executed*100)+'%':'暂无可计算样本';document.querySelector('#summary').innerHTML=`<span>总数 ${data.cases.length}</span>${states.map(s=>`<span>${s} ${count[s]}</span>`).join('')}<span>通过率 ${rate}</span><span>执行完成率 ${den?Math.round(executed/den*100)+'%':'暂无可计算样本'}</span>`}render();
</script></body></html>
