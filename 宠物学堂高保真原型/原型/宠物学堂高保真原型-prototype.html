<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>宠物学堂高保真原型</title>
  <style>
    :root{--lav:#eee9ff;--lav-2:#d8cdfd;--yellow:#fff4c7;--paper:#fffdf7;--ink:#262626;--muted:#716d78;--green:#77bfa3;--orange:#f2b66d;--red:#d96c6c;--line:#e6e0d8;--white:#fff;--shadow:0 10px 28px rgba(70,55,95,.10);--r:20px}
    *{box-sizing:border-box} body{margin:0;background:#e9e5df;color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif} button,input{font:inherit} button{cursor:pointer}
    .prototype-toolbar{position:sticky;top:0;z-index:30;display:flex;gap:8px;align-items:center;padding:10px 14px;background:#26232ddd;color:#fff;backdrop-filter:blur(10px)}
    .prototype-toolbar select,.prototype-toolbar button{min-height:36px;border:0;border-radius:10px;padding:0 12px}.prototype-toolbar select{min-width:240px}.prototype-toolbar .hint{font-size:12px;opacity:.72;margin-left:auto}
    .device-wrapper{padding:28px;display:flex;justify-content:center}.device{position:relative;overflow:hidden;background:var(--paper);box-shadow:0 24px 70px #352e4050;border:8px solid #302d35;border-radius:32px}
    .ipad-land{width:1024px;height:768px}.ipad-port{width:768px;height:1024px}.phone-port{width:390px;height:844px;border-width:6px;border-radius:28px}.phone-land{width:844px;height:390px;border-width:6px;border-radius:24px}
    .app-shell{height:100%;display:grid;grid-template-columns:176px 1fr}.phone .app-shell{grid-template-columns:64px 1fr}.sidebar{background:var(--lav);padding:18px 12px;display:flex;flex-direction:column;gap:8px;border-right:1px solid #dcd3f0;overflow:hidden}
    .profile{display:flex;gap:10px;align-items:center;padding:8px 4px 14px}.avatar{width:44px;height:44px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-size:24px;border:2px solid #fff}.profile strong{font-size:16px}.profile small{display:block;color:var(--muted);margin-top:2px}
    .nav{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:14px;color:#524c5c;font-weight:700;font-size:14px}.nav .ico{font-size:20px;width:24px;text-align:center}.nav.active{background:#fff;box-shadow:0 5px 16px #6f5b9930;color:#3e315f;border-left:4px solid #7860bc;padding-left:8px}.subnav{display:flex;flex-wrap:wrap;gap:6px;padding:0 6px 6px}.chip{border:1px solid #ddd4f3;background:#faf8ff;border-radius:999px;padding:7px 10px;font-size:12px}.chip.active{background:#6e58aa;color:#fff;border-color:#6e58aa}.parent-gate{margin-top:auto;border:1px solid #cfc3ea;background:#ffffffaa;color:#493d64;border-radius:14px;min-height:44px;font-weight:700}
    .phone .sidebar{padding:12px 6px}.phone .profile{justify-content:center;padding:4px 0 10px}.phone .profile div:not(.avatar),.phone .nav span:not(.ico){display:none}.phone .avatar{width:42px;height:42px}.phone .nav{justify-content:center;padding:0}.phone .nav.active{padding:0;border-left:0;border-bottom:4px solid #7860bc}.phone .parent-gate{font-size:0}.phone .parent-gate:after{content:'🔒';font-size:20px}
    .main{padding:22px 24px;overflow:auto}.phone .main{padding:14px}.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}.title-block h1{font-size:26px;margin:0}.title-block p{margin:4px 0 0;color:var(--muted);font-size:14px}.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}.pill{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:13px}.audio{width:44px;height:44px;border:0;border-radius:50%;background:var(--yellow);font-size:20px}
    .tabs{display:flex;gap:8px;overflow:auto;padding-bottom:10px;margin-top:-4px}.tabs .chip{white-space:nowrap;min-height:36px}
    .grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(270px,.85fr);gap:16px}.portrait .grid{grid-template-columns:1fr}.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}.card h2,.card h3{margin:0 0 10px}.muted{color:var(--muted)}
    .hero{min-height:260px;background:linear-gradient(145deg,#fff 0,#f8f4ff 58%,#fff7d8 100%);display:grid;grid-template-columns:1.2fr .8fr;align-items:center}.portrait .hero{grid-template-columns:1fr;min-height:360px}.pet-scene{text-align:center}.cat{font-size:96px;filter:drop-shadow(0 12px 12px #6e5f7330)}.hero-pet{width:150px;height:150px;object-fit:contain;filter:drop-shadow(0 12px 12px #6e5f7330)}.bubble{display:inline-block;background:#fff;border:1px solid #ded6e8;border-radius:18px 18px 18px 4px;padding:10px 14px;font-weight:700;max-width:240px}
    .progress-ring{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) 0 72%,#ece8e1 72%);margin:10px auto}.progress-ring:after{content:'3 / 5';display:grid;place-items:center;width:76px;height:76px;border-radius:50%;background:#fff;font-weight:800;font-size:20px}
    .task-card{display:flex;gap:14px;align-items:center}.task-icon{width:58px;height:58px;border-radius:18px;background:var(--lav);display:grid;place-items:center;font-size:28px;flex:0 0 auto}.task-copy{min-width:0;flex:1}.task-copy h3{font-size:19px}.reward{font-weight:800;color:#8b6b18}.primary{border:0;background:#6e58aa;color:#fff;border-radius:15px;min-height:48px;padding:0 20px;font-weight:800}.secondary{border:1px solid #cfc7d9;background:#fff;border-radius:15px;min-height:46px;padding:0 18px;font-weight:700}.danger-soft{background:#fff2f2;color:#983f3f;border:1px solid #f0c7c7}.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.primary:disabled{background:#cbc5d5;color:#746d7c;cursor:not-allowed}
    .status-list{display:grid;gap:10px}.status-row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:#faf9f5}.status-row strong{margin-left:auto}.ok{color:#3e8069}.warn{color:#9b651c}.err{color:#a94343}
    .learn-layout{display:grid;grid-template-columns:minmax(260px,.9fr) minmax(300px,1.1fr);gap:16px}.portrait .learn-layout,.phone-port .learn-layout{grid-template-columns:1fr}.lesson-main{text-align:center;min-height:390px}.phonetic{font-size:82px;font-weight:800;color:#5f4b96;letter-spacing:8px;margin:12px}.tones{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tone{padding:15px 6px;border:2px solid #ddd3f4;border-radius:16px;background:#faf8ff;font-size:30px;font-weight:800}.tone.active{border-color:#7159af;background:var(--lav)}
    .feedback{border-radius:16px;padding:14px;background:#fff7df;border:1px solid #f0d48b;text-align:left}.wave{height:54px;display:flex;align-items:center;justify-content:center;gap:4px}.wave i{display:block;width:5px;background:#8068bd;border-radius:6px;height:var(--h)}
    .hanzi{font-size:140px;line-height:1.2;font-family:"KaiTi","STKaiti",serif}.tian{position:relative;display:grid;place-items:center;width:300px;height:300px;margin:auto;border:3px solid #b9997a;background:linear-gradient(90deg,transparent 49.6%,#dabfa7 50%,transparent 50.4%),linear-gradient(transparent 49.6%,#dabfa7 50%,transparent 50.4%)}.tian:after,.tian:before{content:'';position:absolute;inset:0;background:linear-gradient(45deg,transparent 49.7%,#e7d3bf 50%,transparent 50.3%)}.tian:after{transform:rotate(90deg)}
    .tenframe{display:grid;grid-template-columns:repeat(5,44px);gap:5px;justify-content:center}.tenframe span{height:44px;border:2px solid #d5ccea;border-radius:10px;background:#fff}.tenframe span.fill{background:#f5c85d}.equation{font-size:36px;font-weight:900;margin:22px 0}.wrong{border-left:6px solid var(--orange);background:#fff8e7;text-align:left}
    .schulte{display:grid;grid-template-columns:repeat(5,64px);gap:7px;justify-content:center}.schulte button{height:64px;border:2px solid #ded7e7;background:#fff;border-radius:12px;font-size:24px;font-weight:800}.schulte button.hit{background:#dff4eb;border-color:var(--green)}
    .reader-card{background:#f8f4ff;border-radius:20px;padding:22px;text-align:center}.reader-card .art{font-size:74px}.sentence{font-size:28px;font-weight:800;line-height:1.5}.highlight{background:#ffe68b;border-radius:6px;padding:0 4px}.answers{display:grid;gap:10px}.answer{border:2px solid #ddd5e7;background:#fff;border-radius:16px;padding:14px;text-align:left;font-weight:700}.answer.selected{border-color:#6e58aa;background:var(--lav)}
    .pet-room{background:linear-gradient(#dff3fb 0 55%,#f2dfbd 55%);border-radius:22px;min-height:350px;display:grid;place-items:center;position:relative}.food{position:absolute;right:18%;bottom:20%;font-size:48px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:12px;background:#faf9f5;border-radius:14px}.bar{height:10px;background:#e8e5df;border-radius:999px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--green);width:var(--v)}
    .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{min-height:70px;border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff}.day.today{outline:3px solid #8a70c7}.day .mark{display:block;margin-top:7px;font-weight:800}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#faf8ff;border-radius:16px;padding:14px}.metric strong{font-size:26px;display:block}
    .plan{display:grid;grid-template-columns:230px 1fr;gap:14px}.portrait .plan,.phone .plan{grid-template-columns:1fr}.week{display:grid;gap:8px}.week button{border:0;background:#faf9f5;border-radius:12px;padding:12px;text-align:left}.week button.active{background:var(--lav);font-weight:800}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field input{min-height:44px;border:1px solid #d8d1df;border-radius:12px;padding:0 12px}.report-bars{display:grid;gap:12px}.report-bar{display:grid;grid-template-columns:56px 1fr 40px;align-items:center;gap:8px}.report-bar .bar i{background:#8068bd}
    .state-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.state-card{min-height:150px;display:grid;place-items:center;text-align:center;border:1px dashed #cfc8d8;border-radius:18px;padding:14px}.spinner{width:34px;height:34px;border:4px solid #ddd3f4;border-top-color:#6e58aa;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .pet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.pet-card{position:relative;min-height:230px;text-align:center;border:2px solid #e3ddea;border-radius:20px;background:#fff;padding:16px}.pet-card.selected{border-color:#7860bc;background:#faf8ff}.pet-card.locked{background:#f3f1ed;color:#777}.pet-card.locked .pet-figure img{filter:saturate(.5);opacity:.72}.pet-figure{height:120px;display:grid;place-items:center;font-size:76px}.pet-figure img{width:150px;height:120px;object-fit:contain}.future-art{max-width:620px;width:100%;height:250px;object-fit:contain}.outfit-sheet{width:100%;height:260px;object-fit:contain}.tag{display:inline-block;border-radius:999px;padding:5px 9px;background:var(--lav);font-size:12px;font-weight:700}.stage-track{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stage-step{position:relative;text-align:center;padding:16px 8px;border:1px solid var(--line);border-radius:16px;background:#fff}.stage-step.done{background:#e8f6ef;border-color:var(--green)}.stage-step.current{background:var(--lav);border:2px solid #7860bc}.stage-dot{width:48px;height:48px;margin:auto auto 8px;border-radius:50%;display:grid;place-items:center;background:#f1ede7;font-size:24px}.stage-step.done .stage-dot{background:var(--green);color:#fff}.closet{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.closet button{min-height:94px;border:1px solid var(--line);border-radius:15px;background:#fff;font-size:30px}.closet button.active{background:var(--lav);border:2px solid #7860bc}.closet small{display:block;font-size:12px;color:var(--muted);margin-top:6px}.pet-art{max-width:100%;height:340px;object-fit:contain}.lock-progress{height:12px;background:#e4e0da;border-radius:999px;overflow:hidden}.lock-progress i{display:block;height:100%;width:68%;background:#8068bd}
    .phone .topbar{align-items:flex-start}.phone .title-block h1{font-size:21px}.phone .top-actions .pill{display:none}.phone .hero{grid-template-columns:1fr;min-height:270px;padding:14px}.phone .cat{font-size:68px}.phone .grid,.phone .summary,.phone .state-grid{grid-template-columns:1fr}.phone .task-card{align-items:flex-start}.phone-land .main{padding:10px 14px}.phone-land .topbar{margin-bottom:8px}.phone-land .learn-layout{grid-template-columns:1fr 1fr}.phone-land .lesson-main{min-height:250px}.phone-land .phonetic{font-size:54px;margin:4px}.phone-land .tones .tone{font-size:22px;padding:8px 4px}.phone-land .feedback{padding:9px}.phone-land .actions{margin-top:8px}.phone-land .top-actions{display:none}
    .toast{position:absolute;right:22px;bottom:22px;background:#2f2b36;color:#fff;padding:12px 16px;border-radius:14px;box-shadow:var(--shadow);display:none}.toast.show{display:block}.page-state{display:none}.page-state.active{display:block}
    .dialog-backdrop{position:absolute;inset:0;z-index:20;display:none;place-items:center;padding:24px;background:#28243166;backdrop-filter:blur(3px)}.dialog-backdrop.show{display:grid}.dialog{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 64px #2f263d45;padding:22px}.dialog h2{margin:0 0 8px}.dialog .dialog-icon{width:64px;height:64px;display:grid;place-items:center;margin:0 auto 12px;border-radius:20px;background:var(--lav);font-size:34px}.dialog .actions{justify-content:flex-end}.dialog-sheet{align-items:end}.dialog-sheet .dialog{width:min(620px,100%);border-radius:24px 24px 12px 12px}.dialog-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.dialog-preview{min-height:160px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line);border-radius:18px;padding:14px;background:#fff}.dialog-preview h3{font-size:16px}.dialog-preview p{font-size:13px}.dialog-preview button{min-height:40px}.check-list{display:grid;gap:10px;margin:14px 0}.check-item{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;background:#faf9f5}.record-panel{display:grid;place-items:center;min-height:180px;border:1px dashed #cfc7d9;border-radius:18px;background:#faf8ff}.record-button{width:78px;height:78px;border:0;border-radius:50%;background:#6e58aa;color:#fff;font-size:30px;box-shadow:0 8px 20px #6e58aa40}
    @media(max-width:900px){.prototype-toolbar .hint{display:none}.device-wrapper{padding:12px}.prototype-toolbar select{min-width:170px}.ipad-land,.ipad-port{transform-origin:top center}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="prototype-toolbar" data-export-ui="true">
    <strong>宠物学堂</strong>
    <select id="pageSelect" aria-label="选择原型页面"></select>
    <button id="prevBtn">上一页</button><button id="nextBtn">下一页</button>
    <span class="hint">所有内容均为原型演示数据</span>
    <button id="exportFab" class="export-btn">一键导出所有截图</button>
  </div>
  <main id="stage"></main>
  <script>
    (()=>{
    // 页头函数声明会提升，因此先建立局部别名，再初始化页面数据，避免页面模板访问未初始化变量。
    const top=renderPageHeader;
    // 原型统一页面数据：页面目录、设备尺寸和内容保持同一事实源，避免 PRD 与原型命名漂移。
    const pages=[
      {id:'today-ipad-landscape',label:'P01 · iPad 横屏｜今日任务',device:'ipad-land',body:today(false)},
      {id:'today-ipad-portrait',label:'P02 · iPad 竖屏｜今日任务',device:'ipad-port portrait',body:today(true)},
      {id:'pinyin-correction',label:'P03 · 拼音｜四声跟读纠错',device:'ipad-land',body:pinyin()},
      {id:'hanzi-tracing',label:'P04 · 生字｜笔顺与描红',device:'ipad-land',body:hanzi()},
      {id:'math-ten',label:'P05 · 数感｜凑十法答错提示',device:'ipad-land',body:math()},
      {id:'schulte',label:'P06 · 专注力｜舒尔特方格',device:'ipad-land',body:schulte()},
      {id:'english-reader',label:'P07 · 英语｜分级跟读与日常互动',device:'ipad-land',body:english()},
      {id:'pet-center',label:'P08 · 猫咪成长中心｜喂食',device:'ipad-land',body:pet()},
      {id:'calendar-review',label:'P09 · 月历｜月末总结',device:'ipad-land',body:calendar()},
      {id:'parent-plan',label:'P10 · 家长区｜配置周计划',device:'ipad-land',body:parentPlan()},
      {id:'parent-report',label:'P11 · 家长区｜周报与调整',device:'ipad-land',body:parentReport()},
      {id:'mobile-home',label:'P12 · 手机竖屏｜今日任务',device:'phone-port phone',body:todayMobile()},
      {id:'mobile-quiz',label:'P13 · 手机横屏｜拼音答题',device:'phone-land phone',body:pinyin(true)},
      {id:'system-states',label:'P14 · 通用状态｜加载/离线/失败',device:'ipad-land',body:states()},
      {id:'pet-adoption',label:'P15 · 宠物中心｜首次领养',device:'ipad-land',body:petAdoption()},
      {id:'pet-detail',label:'P16 · 宠物中心｜伙伴详情',device:'ipad-land',body:petDetail()},
      {id:'pet-growth-path',label:'P17 · 宠物中心｜四阶段成长',device:'ipad-land',body:petGrowth()},
      {id:'pet-wardrobe',label:'P18 · 宠物中心｜装扮衣橱',device:'ipad-land',body:petWardrobe()},
      {id:'pet-fantasy-lock',label:'P19 · 宠物中心｜幻想伙伴解锁',device:'ipad-land',body:petFantasy()},
      {id:'pet-future',label:'P20 · 宠物中心｜未来伙伴',device:'ipad-land',body:petFuture()},
      {id:'math-explain',label:'P21 · 数学｜讲数学题',device:'ipad-land',body:mathExplain()},
      {id:'reading-checkin',label:'P22 · 阅读｜阅读打卡',device:'ipad-land',body:readingCheckin()},
      {id:'sanmi-checkin',label:'P23 · 英语｜三米打卡',device:'ipad-land',body:sanmiCheckin()},
      {id:'dialog-states',label:'P24 · 通用交互｜关键弹窗与底部面板',device:'ipad-land',body:dialogStates()}
    ];
    function nav(active='今日任务',sub=''){const items=[['🏠','今日任务'],['文','语文'],['➕','数感'],['A','英语'],['🧹','家务'],['🏃','兴趣'],['🔎','科普专区'],['🐱','成长中心'],['▣','日历打卡']];return `<aside class="sidebar"><div class="profile"><div class="avatar">🐱</div><div><strong>小雨</strong><small>⭐ 35 颗</small></div></div>${items.map(([i,n])=>`<div class="nav ${n===active?'active':''}"><span class="ico">${i}</span><span>${n}</span></div>`).join('')}${sub?`<div class="subnav">${sub.split('|').map((s,i)=>`<button class="chip ${i===0?'active':''}">${s}</button>`).join('')}</div>`:''}<button class="parent-gate" data-action="gate">长按进入家长区</button></aside>`}
    // 避免使用浏览器保留的 window.top 名称，保证原型与公共导出脚本同时加载时不会发生全局声明冲突。
    function renderPageHeader(title,desc='今天也和猫咪一起进步吧'){return `<header class="topbar"><div class="title-block"><h1>${title}</h1><p>${desc}</p></div><div class="top-actions"><div class="pill">9月9日 · 周三</div><div class="pill">🔥 连续 4 天</div><button class="audio" aria-label="播放语音讲解" data-action="audio">🔊</button></div></header>`}
    function shell(main,active='今日任务',sub='',cls=''){return `<div class="app-shell ${cls}">${nav(active,sub)}<section class="main">${main}</section></div><div class="toast" role="status"></div>`}
    // 单项任务只推进今日进度；星星礼包在全部必做项完成且家长确认通过后统一结算。
    function today(portrait){return shell(`${top('今天的任务','完成五项任务，一次领取今日星星礼包')}<div class="grid"><section class="card hero"><div><span class="pill">今日进度 · 3/5</span><h2 style="font-size:28px;margin:16px 0 8px">下一项：三米打卡</h2><p class="muted">按家长设置的任务说明完成并提交确认</p><div class="actions"><button class="primary" data-action="success">开始任务</button></div></div><div class="pet-scene"><div class="bubble">完成全部五项，就能领取今日礼包！</div><div class="cat">🐱</div></div></section><aside class="card"><h2>今日五项任务</h2><div class="status-list"><div class="status-row">✅ 阅读打卡<strong class="ok">已完成</strong></div><div class="status-row">✅ 英语打卡<strong class="ok">已完成</strong></div><div class="status-row">⏳ 三米打卡<strong class="warn">待家长确认</strong></div><div class="status-row">✅ 数学天天练<strong class="ok">已完成</strong></div><div class="status-row">▶ 讲数学题<strong>去完成</strong></div></div><button class="secondary" disabled style="width:100%;margin-top:14px">⭐ 今日礼包 · 五项完成后领取</button></aside></div>`, '今日任务','',portrait?'portrait':'')}
    function pinyin(compact=false){return shell(`${top('拼音 · 四声训练','第 3/10 组 · 跟着声音慢慢读')}<div class="tabs"><button class="chip active">拼音</button><button class="chip">生字</button><button class="chip">古诗</button><button class="chip">朗诵</button></div><div class="learn-layout"><section class="card lesson-main"><span class="pill">单韵母 a</span><div class="phonetic">ā á ǎ à</div><div class="tones">${['ā','á','ǎ','à'].map((x,i)=>`<button class="tone ${i===2?'active':''}">${x}</button>`).join('')}</div><p class="muted">第三声：声音先降下来，再轻轻扬起</p><div class="actions" style="justify-content:center"><button class="secondary" data-action="audio">▶ 慢速听</button><button class="primary" data-action="record">🎙 按住跟读</button></div></section><aside class="card"><h2>再试一次，你很接近了</h2><div class="wave">${[18,30,44,26,49,38,22,45,31,18].map(h=>`<i style="--h:${h}px"></i>`).join('')}</div><div class="feedback"><strong>声调小提示</strong><p>声母和韵母都读对了。第三声后半段再向上扬一点，会更清楚。</p></div><div class="actions"><button class="secondary" data-action="audio">再听一次</button><button class="primary" data-action="success">重新跟读</button></div><p class="muted">语音反馈只作参考，也可以请家长确认。</p></aside></div>`,'语文','拼音|生字|古诗|朗诵',compact?'compact':'')}

    function math(){return shell(`${top('数感 · 凑十法','第 8/20 题 · 先凑成 10 会更容易')}<div class="learn-layout"><section class="card lesson-main"><span class="pill">用十格框想一想</span><div class="equation">8 + 5 = ?</div><div class="tenframe">${Array.from({length:10},(_,i)=>`<span class="${i<8?'fill':''}"></span>`).join('')}</div><p style="font-size:20px">把 5 分成 <strong>2</strong> 和 <strong>3</strong>，8 + 2 = 10，再加 3。</p></section><aside class="card"><h2>选择答案</h2><div class="answers">${[12,13,14].map(n=>`<button class="answer ${n===12?'selected':''}">${n}</button>`).join('')}</div><div class="feedback wrong" style="margin-top:14px"><strong>先别急着看答案</strong><p>8 还差 2 就到 10。请先从 5 里面拿出 2，再数剩下的。</p></div><div class="actions"><button class="secondary">看分步提示</button><button class="primary" data-action="success">我再算一次</button></div></aside></div>`,'数感','100以内数学|数独|思维|专注力')}

    // 幻想伙伴采用可解释的确定性里程碑；达标资格永久保留且不消耗星星。
    function petFantasy(){return shell(`${top('幻想伙伴','达到明确里程碑后确定性解锁')}<div class="pet-grid"><article class="pet-card locked"><span class="tag">幻想伙伴</span><div class="pet-figure"><img src="../../资产/宠物/fantasy-hamster-nursing-v1.png" alt="星点小仓鼠"></div><h2>星点小仓鼠</h2><p>30 个礼包日 + 语数英各 5 项</p><div class="lock-progress"><i style="width:68%"></i></div><small>礼包日 20 / 30 · 分类任务还差 4 项</small></article><article class="pet-card locked"><span class="tag">幻想伙伴</span><div class="pet-figure"><img src="../../资产/宠物/little-azure-dragon-nursing-v2.png" alt="小青龙"></div><h2>小青龙</h2><p>60 个礼包日 + 四类各 10 项</p><div class="lock-progress"><i style="width:34%"></i></div><small>礼包日 20 / 60 · 四类任务继续积累</small></article><article class="pet-card"><span class="tag">解锁说明</span><div class="pet-figure">⭐</div><h2>认真学习，自然相遇</h2><p class="muted">无需星星购买，没有抽取概率，达标资格不会过期。</p></article></div>`,'成长中心')}
    function petFuture(){return shell(`${top('更多伙伴正在准备中','这里没有倒计时，也不需要提前付费')}<section class="card" style="text-align:center;padding:30px"><img class="future-art" src="../../资产/宠物/future-pet-placeholder-v1.png" alt="未来伙伴剪影"><h2>未来会有新的陪伴故事</h2><p class="muted">具体伙伴尚未确定。等内容、美术和儿童安全审核完成后再开放。</p><div class="actions" style="justify-content:center"><button class="secondary" data-go="pet-adoption">看看常见伙伴</button><button class="primary" data-go="pet-detail">回到我的伙伴</button></div></section>`,'成长中心')}
    // 讲数学题区分提交方式与最终评判：系统只辅助检查，完成状态必须由家长确认。
    function mathExplain(){return shell(`${top('讲数学题','把你的想法讲清楚，比只说答案更重要')}<div class="learn-layout"><section class="card lesson-main"><span class="pill">幼小衔接 · 今日题目</span><div class="equation">8 + 5 = ?</div><div class="feedback"><strong>按三步讲一讲</strong><p>① 题目问什么？　② 你是怎么想的？　③ 答案是什么？</p></div><p class="muted">题目从已审核题库按能力档选取，当日生成后不会因刷新而更换。</p></section><aside class="card"><h2>选择讲题方式</h2><div class="answers"><button class="answer selected">👨‍👩‍👧 当面讲给家长听</button><button class="answer">🎙 录音后请家长确认</button></div><div class="feedback" style="margin-top:14px"><strong>谁来判断完成？</strong><p>两种方式都由家长最终确认。系统只检查答案和提交是否完整，不自动评价孩子讲得好不好。</p></div><div class="actions"><button class="secondary">查看分步提示</button><button class="primary" data-action="success">我讲完了，提交确认</button></div><p class="muted">提交后状态为“等待家长确认”；被退回时可查看原因并重新讲。</p></aside></div>`,'数感','数学天天练|讲数学题')}
    // 阅读打卡只记录完成事实与可选书目信息，提交后由家长确认，不要求儿童上传图片。
    function readingCheckin(){return shell(`${top('阅读打卡','安静读一会儿，再告诉家长你读了什么')}<div class="learn-layout"><section class="card lesson-main"><span class="pill">今日目标 · 10 分钟</span><div style="font-size:86px;margin:28px 0 12px">📖</div><h2>读你喜欢的一本书</h2><p class="muted">家长设置：阅读 10 分钟；书名和页数可以不填。</p><div class="check-list"><div class="check-item">⏱️ <div><strong>计时已完成</strong><br><span class="muted">10:00 / 10:00</span></div></div><div class="check-item">💬 <div><strong>想一想</strong><br><span class="muted">我最喜欢哪一段？</span></div></div></div></section><aside class="card"><h2>完成记录</h2><label class="field">书名（选填）<input value="小熊和月亮" maxlength="40"></label><label class="field" style="margin-top:12px">读到哪里（选填）<input value="第 12 页" maxlength="30"></label><div class="feedback" style="margin-top:14px"><strong>不用上传照片</strong><p>点击提交后请家长确认。单项完成只增加今日进度，不会立即获得星星。</p></div><div class="actions"><button class="secondary" data-dialog="exit">稍后继续</button><button class="primary" data-dialog="submit">提交阅读打卡</button></div></aside></div>`,'语文','阅读打卡')}
    // “三米”是家长确认的教师名；页面展示家长下发内容，避免系统误解为通用英语题库任务。
    function sanmiCheckin(){return shell(`${top('三米打卡','完成三米老师今天布置的英语内容')}<div class="learn-layout"><section class="card lesson-main"><span class="pill">家庭任务 · 约 5 分钟</span><div style="font-size:78px;margin:24px 0 8px">🎧</div><h2>跟读今天的 3 句英语</h2><div class="reader-card" style="margin-top:16px"><p class="sentence" style="font-size:22px">Good morning!<br>I am ready.<br>Let’s learn together.</p></div><p class="muted">内容来自家长填写的任务说明或已审核材料，不由系统临时自由生成。</p></section><aside class="card"><h2>完成方式</h2><div class="answers"><button class="answer selected">👨‍👩‍👧 当面读给家长听</button><button class="answer">🎙 录音后请家长确认</button></div><div class="feedback" style="margin-top:14px"><strong>最终由家长确认</strong><p>系统只检查是否提交成功；语音评分不作为唯一通过标准。</p></div><div class="actions"><button class="secondary" data-dialog="record">开始录音</button><button class="primary" data-dialog="submit">我完成了，提交确认</button></div></aside></div>`,'英语','英语打卡|三米打卡')}
    // 关键弹窗状态单独成页，供产品评审、视觉出图和研发验收复用；点击卡片可查看真实遮罩层效果。
    function dialogStates(){return shell(`${top('关键弹窗与底部面板','覆盖任务提交、录音、奖励、领养与投喂的 P0 状态')}<div class="dialog-gallery"><article class="dialog-preview"><div><h3>退出并保存</h3><p class="muted">中途退出、离线草稿</p></div><button class="secondary" data-dialog="exit">查看弹窗</button></article><article class="dialog-preview"><div><h3>提交任务</h3><p class="muted">确认后等待家长审核</p></div><button class="primary" data-dialog="submit">查看弹窗</button></article><article class="dialog-preview"><div><h3>录音授权</h3><p class="muted">监护人同意与拒绝回退</p></div><button class="secondary" data-dialog="record">查看底部面板</button></article><article class="dialog-preview"><div><h3>家长退回</h3><p class="muted">展示原因并重新提交</p></div><button class="secondary" data-dialog="rejected">查看弹窗</button></article><article class="dialog-preview"><div><h3>星星礼包</h3><p class="muted">五项通过后一次领取</p></div><button class="primary" data-dialog="reward">查看弹窗</button></article><article class="dialog-preview"><div><h3>领养 / 投喂</h3><p class="muted">二次确认与余额不足</p></div><button class="secondary" data-dialog="feed">查看弹窗</button></article></div>`,'今日任务')}
    function states(){return shell(`${top('通用状态检查板','同一业务组件的关键异常与恢复动作')}<div class="state-grid"><div class="state-card"><div><div class="spinner" style="margin:auto"></div><h3>正在准备今天的任务</h3><p class="muted">不会重复生成任务</p></div></div><div class="state-card"><div><div style="font-size:36px">📭</div><h3>今天还没有任务</h3><p class="muted">请家长设置计划，或先陪伙伴玩一会儿。</p><button class="secondary">通知家长</button></div></div><div class="state-card"><div><div style="font-size:36px">📡</div><h3>当前处于离线状态</h3><p class="muted">已下载的任务可以继续，奖励联网后确认。</p><button class="primary">继续缓存任务</button></div></div><div class="state-card"><div><div style="font-size:36px">↻</div><h3>提交没有送达</h3><p class="muted">答案已保存在这台设备，没有扣除或增加星星。</p><button class="primary">重新提交</button></div></div><div class="state-card"><div><img src="../../资产/宠物/daily-star-package-states-v1.png" alt="今日礼包已解锁" style="width:150px;height:70px;object-fit:cover;object-position:center"><h3>今天的任务完成啦</h3><p class="muted">今日 20 颗星礼包已解锁，领取后可去照料伙伴。</p><button class="primary" data-go="pet-center">领取礼包并去宠物中心</button></div></div><div class="state-card"><div><div style="font-size:36px">🔒</div><h3>内容暂时不可用</h3><p class="muted">该内容已下架，我们为你换了一项安全任务。</p><button class="secondary">返回今天</button></div></div></div>`,'今日任务')}
    // 页面渲染仅替换当前设备画板；hash 可稳定定位，供 PRD、流程图和评审链接复用。
    const stage=document.querySelector('#stage'),select=document.querySelector('#pageSelect');pages.forEach(p=>select.add(new Option(p.label,p.id)));
    function render(){const id=location.hash.slice(1)||pages[0].id;const p=pages.find(x=>x.id===id)||pages[0];select.value=p.id;stage.innerHTML=`<div class="device-wrapper"><div class="device ${p.device}" id="${p.id}">${p.body}<div class="dialog-backdrop" role="presentation"></div></div></div>`;wire();window.parent.postMessage({type:'page-changed',page:p.id},'*')}
    function dialogMarkup(type){const data={exit:['↩','要先离开吗？','进度已经保存在这台设备，下次可以从这里继续。','继续任务','保存并离开'],submit:['✓','确认提交任务？','提交后会进入“等待家长确认”，家长通过后今日进度才会增加。','再检查一下','确认提交'],record:['🎙','需要使用麦克风','录音默认关闭。请先让家长同意；不同意也可以改为当面讲。','改为当面讲','请家长开启'],rejected:['💬','家长请你再试一次','退回原因：声音有点小，请把“我是怎么想的”再讲清楚。','返回今天','重新讲'],reward:['⭐','今日星星礼包已解锁','五项任务都通过啦！领取 20 颗星后，可以去宠物中心照料伙伴。','稍后领取','领取并去宠物中心'],feed:['🍎','给小星投喂苹果？','将消耗 5 颗星并增加 5 点成长值。今天还能付费投喂 3 次；余额不足时不会扣除星星。','取消','确认投喂']}[type]||['✓','操作确认','请确认后继续。','取消','确认'];return `<div class="dialog-icon">${data[0]}</div><h2>${data[1]}</h2><p class="muted">${data[2]}</p><div class="actions"><button class="secondary" data-close-dialog>${data[3]}</button><button class="primary" data-close-dialog>${data[4]}</button></div>`}
    function wire(){stage.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>location.hash=b.dataset.go);stage.querySelectorAll('[data-dialog]').forEach(b=>b.onclick=()=>{const backdrop=stage.querySelector('.dialog-backdrop');backdrop.classList.toggle('dialog-sheet',b.dataset.dialog==='record');backdrop.innerHTML=`<section class="dialog" role="dialog" aria-modal="true">${dialogMarkup(b.dataset.dialog)}</section>`;backdrop.classList.add('show');backdrop.querySelectorAll('[data-close-dialog]').forEach(x=>x.onclick=()=>backdrop.classList.remove('show'))});stage.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const t=stage.querySelector('.toast');if(b.dataset.action==='selectPet'){const cards=stage.querySelectorAll('.pet-card');cards.forEach(card=>{card.classList.remove('selected');const button=card.querySelector('[data-action="selectPet"]');if(button)button.className='secondary'});const card=b.closest('.pet-card');card.classList.add('selected');b.className='primary'}const msg={audio:'正在播放慢速讲解',record:'正在听你跟读',success:'已保存进度',swap:'已换成家长允许的下一项',gate:'家长门演示：长按后需成人验证',feed:'投喂成功：星星 -5，成长值 +5（今日 2 / 4 次）',pause:'已暂停并保存本组进度',selectPet:'已选中这位伙伴，确认前还可以更换'}[b.dataset.action]||'操作已记录';t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)});stage.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{b.parentElement.querySelectorAll('.answer').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')})}
    select.onchange=()=>location.hash=select.value;document.querySelector('#prevBtn').onclick=()=>step(-1);document.querySelector('#nextBtn').onclick=()=>step(1);function step(d){const i=pages.findIndex(p=>p.id===select.value);location.hash=pages[(i+d+pages.length)%pages.length].id}window.addEventListener('hashchange',render);window.addEventListener('message',e=>{if(e.source===window.parent&&e.data?.type==='navigate'&&pages.some(p=>p.id===e.data.page))location.hash=e.data.page});render();
    })();
  </script>
  <script src="../../scripts/pm-runtime-config.js"></script>
  <script src="../../scripts/prototype-export-client.js"></script>
