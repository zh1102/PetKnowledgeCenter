<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#7156B8" flood-opacity="0.12"/></filter>
    <style>.font{font-family:'PingFang SC','Microsoft YaHei',sans-serif}.ink{fill:#432B2B}.muted{fill:#766A7D}.purple{fill:#7959D7}.h1{font-size:54px;font-weight:800}.h2{font-size:28px;font-weight:700}.body{font-size:20px}.small{font-size:16px}</style>
  </defs>

  <g id="01-页面背景">
    <rect width="1440" height="1080" fill="#FFFBF3"/>
    <path d="M0 1015c75-68 165-59 255 1v64H0z" fill="#D9EFCB"/><circle cx="58" cy="1038" r="74" fill="#B8DDA8"/><circle cx="171" cy="1057" r="92" fill="#CCE7B9"/>
    <path d="M1130 1080c72-87 186-97 310-32v32z" fill="#D7EDC4"/><circle cx="1390" cy="1053" r="69" fill="#B8DDA8"/>
  </g>

  <g id="02-左侧导航">
    <rect width="252" height="1080" fill="#F0EBFF"/>
    <g id="Logo" transform="translate(28 32)"><circle cx="34" cy="34" r="31" fill="#FFFFFF"/><path d="M14 31c0-18 10-27 20-27s20 9 20 27c0 19-11 27-20 27S14 50 14 31z" fill="#855FE8"/><circle cx="27" cy="32" r="3" fill="#fff"/><circle cx="41" cy="32" r="3" fill="#fff"/><text class="font ink" x="76" y="31" font-size="26" font-weight="800">宠物学堂</text><text class="font purple" x="76" y="55" font-size="15">儿童端</text></g>
    <g id="Nav-今日任务-Selected" transform="translate(16 160)"><rect width="220" height="72" rx="18" fill="#8B69E7"/><image x="16" y="12" width="48" height="48" href="{{NAV_TODAY}}"/><text class="font" x="80" y="45" font-size="21" font-weight="700" fill="#FFFFFF">今日任务</text></g>
    <g id="Nav-语文" transform="translate(16 246)"><image x="16" y="8" width="48" height="48" href="{{NAV_CHINESE}}"/><text class="font body" x="80" y="40" fill="#55477B">语文</text></g>
    <g id="Nav-数感" transform="translate(16 310)"><image x="16" y="8" width="48" height="48" href="{{NAV_MATH}}"/><text class="font body" x="80" y="40" fill="#55477B">数感</text></g>
    <g id="Nav-英语" transform="translate(16 374)"><image x="16" y="8" width="48" height="48" href="{{NAV_ENGLISH}}"/><text class="font body" x="80" y="40" fill="#55477B">英语</text></g>
    <g id="Nav-成长中心" transform="translate(16 438)"><image x="16" y="8" width="48" height="48" href="{{NAV_GROWTH}}"/><text class="font body" x="80" y="40" fill="#55477B">成长中心</text></g>
    <line x1="28" y1="520" x2="224" y2="520" stroke="#D4C9F1"/>
    <g id="Nav-我的宠物" transform="translate(16 536)"><image x="16" y="8" width="48" height="48" href="{{NAV_PET}}"/><text class="font body" x="80" y="40" fill="#55477B">我的宠物</text></g>
    <g id="Nav-学习报告" transform="translate(16 600)"><image x="16" y="8" width="48" height="48" href="{{NAV_REPORT}}"/><text class="font body" x="80" y="40" fill="#55477B">学习报告</text></g>
    <g id="Nav-设置" transform="translate(16 664)"><image x="16" y="8" width="48" height="48" href="{{NAV_SETTINGS}}"/><text class="font body" x="80" y="40" fill="#55477B">设置</text></g>
    <text class="font" x="42" y="952" font-size="18" fill="#7765A7" transform="rotate(-8 42 952)">好习惯，让我变更棒！</text>
  </g>

  <g id="03-页面标题区">
    <g id="标题图标" transform="translate(286 86)"><rect width="112" height="76" rx="22" fill="#9B7DE8"/><path d="M20 20c22-8 36-5 48 4v42c-12-9-26-12-48-4zm72 0c-22-8-36-5-48 4v42c12-9 26-12 48-4z" fill="#fff" stroke="#7254C9" stroke-width="4"/></g>
    <text id="页面标题" class="font ink h1" x="420" y="150">阅读打卡</text>
    <text id="页面说明" class="font ink" x="306" y="218" font-size="30">安静读一会儿，再告诉家长你读了什么。</text>
    <g id="用户信息" transform="translate(1242 22)"><circle cx="28" cy="28" r="27" fill="#DCCEFF"/><image x="6" y="6" width="44" height="44" href="{{CAT}}"/><text class="font ink" x="70" y="26" font-size="20" font-weight="700">小米</text><text class="font muted" x="70" y="50" font-size="15">一年级</text></g>
    <g id="右上角鼓励便签" transform="translate(1170 96) rotate(-4)"><rect width="220" height="130" rx="12" fill="#FFF8E8" stroke="#F3DDAE"/><text class="font ink" x="28" y="52" font-size="22">读书</text><text class="font ink" x="28" y="86" font-size="22">让世界更大！</text><text x="170" y="58" font-size="38">★</text></g>
  </g>

  <g id="04-主要内容">
    <g id="任务信息卡" transform="translate(274 260)">
      <rect width="570" height="720" rx="28" fill="#FFFFFF" stroke="#DED3F5" stroke-width="2" filter="url(#softShadow)"/>
      <g id="今日目标" transform="translate(32 30)"><circle cx="28" cy="28" r="25" fill="#F0E9FF"/><circle cx="28" cy="28" r="13" fill="none" stroke="#8968DE" stroke-width="5"/><text class="font ink h2" x="70" y="38">今日目标 · 10 分钟</text></g>
      <g id="宠物正式资产" transform="translate(78 120)"><image x="0" y="0" width="410" height="310" preserveAspectRatio="xMidYMid meet" href="{{CAT}}"/></g>
      <text class="font ink" x="285" y="470" text-anchor="middle" font-size="20">计时已完成</text>
      <rect x="72" y="490" width="426" height="22" rx="11" fill="#E9E2FA"/><rect x="72" y="490" width="426" height="22" rx="11" fill="#9673E8"/>
      <text class="font purple" x="285" y="560" text-anchor="middle" font-size="42" font-weight="800">10:00 <tspan font-size="28">/ 10:00</tspan></text>
      <g id="引导问题" transform="translate(32 600)"><rect width="506" height="92" rx="24" fill="#F3EEFF"/><text x="28" y="44" font-size="32">💡</text><rect x="86" y="18" width="112" height="40" rx="20" fill="#A98CED"/><text class="font" x="142" y="45" text-anchor="middle" font-size="17" fill="#fff">想一想</text><text class="font ink" x="253" y="76" text-anchor="middle" font-size="25">我最喜欢哪一段？</text></g>
    </g>

    <g id="完成记录卡" transform="translate(864 260)">
      <rect width="540" height="720" rx="28" fill="#FFFFFF" stroke="#DED3F5" stroke-width="2" filter="url(#softShadow)"/>
      <g id="卡片标题" transform="translate(32 30)"><rect width="52" height="52" rx="14" fill="#EFE8FF"/><path d="M16 16h24v25H16zM10 22h8M10 30h8M10 38h8" fill="none" stroke="#8968DE" stroke-width="4" stroke-linecap="round"/><text class="font ink h2" x="72" y="38">完成记录</text></g>
      <text class="font ink body" x="32" y="142">书名（选填）</text>
      <g id="输入框-书名" transform="translate(32 158)"><rect width="476" height="72" rx="16" fill="#FFFFFF" stroke="#CFC3EC" stroke-width="2"/><text class="font ink" x="24" y="46" font-size="23">小熊和月亮</text><circle cx="442" cy="36" r="14" fill="#D6D0DF"/><text x="442" y="43" text-anchor="middle" font-size="20" fill="#fff">×</text></g>
      <text class="font ink body" x="32" y="282">读到哪里（选填）</text>
      <g id="输入框-页码" transform="translate(32 298)"><rect width="476" height="72" rx="16" fill="#FFFFFF" stroke="#CFC3EC" stroke-width="2"/><text class="font ink" x="24" y="46" font-size="23">第 12 页</text><circle cx="442" cy="36" r="14" fill="#D6D0DF"/><text x="442" y="43" text-anchor="middle" font-size="20" fill="#fff">×</text></g>
      <g id="免上传照片提示" transform="translate(32 398)"><rect width="476" height="88" rx="20" fill="#F4F0FB"/><text x="118" y="56" font-size="28">📷</text><text class="font ink" x="205" y="56" font-size="22" font-weight="700">不用上传照片</text></g>
      <line x1="32" y1="514" x2="508" y2="514" stroke="#DDD5EE" stroke-dasharray="6 5"/>
      <g id="提交说明" transform="translate(32 546)"><text class="font ink" x="0" y="0" font-size="19">提交后请家长确认。</text><text class="font ink" x="0" y="32" font-size="19">单项完成只增加今日进度，不会立即获得星星。</text></g>
      <g id="操作按钮" transform="translate(32 626)"><g id="按钮-稍后继续"><rect width="194" height="62" rx="20" fill="#FFFFFF" stroke="#BBADE4" stroke-width="2"/><text class="font ink" x="97" y="39" text-anchor="middle" font-size="21">稍后继续</text></g><g id="按钮-提交阅读打卡" transform="translate(214 0)"><rect width="262" height="62" rx="20" fill="#8B69E7"/><text class="font" x="131" y="39" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">提交阅读打卡</text></g></g>
    </g>
  </g>

  <g id="05-状态与反馈" opacity="0"><rect x="0" y="0" width="1440" height="1080" fill="#2A2035" fill-opacity="0.4"/><text class="font" x="720" y="540" text-anchor="middle" font-size="28" fill="#fff">用于加载、错误与确认状态</text></g>
  <g id="06-弹窗" opacity="0"><rect x="390" y="330" width="660" height="360" rx="28" fill="#fff"/><text class="font ink h2" x="440" y="400">确认提交阅读打卡吗？</text></g>
</svg>
